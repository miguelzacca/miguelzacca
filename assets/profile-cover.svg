<svg width="1440" height="560" viewBox="0 0 1440 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Miguel Zacca — software products, built end to end</title>
  <desc id="desc">Dark graphite editorial cover with gold accents, Miguel Zacca's name and an abstract product system diagram.</desc>
  <defs>
    <linearGradient id="surface" x1="92" y1="44" x2="1348" y2="532" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151518"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="gold" x1="1040" y1="112" x2="1230" y2="412" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8C8A5"/>
      <stop offset="1" stop-color="#927B50"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1112 275) rotate(90) scale(274 324)">
      <stop stop-color="#B09C76" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#B09C76" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#F3F3F5" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1440" height="560" rx="28" fill="url(#surface)"/>
  <rect x="1" y="1" width="1438" height="558" rx="27" stroke="#FFFFFF" stroke-opacity="0.09"/>
