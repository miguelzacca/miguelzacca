  <text x="88" y="297" fill="#F7F7F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="620" letter-spacing="-2.4">built end to end.</text>
  <text x="92" y="356" fill="#B6B6BE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" letter-spacing="0.2">Interfaces · data · automation · operations</text>

