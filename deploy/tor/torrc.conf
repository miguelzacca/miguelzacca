# Standalone instance; the distribution's /etc/tor/torrc is not imported.
DataDirectory /var/lib/tor/miguelzacca-onion-data
RunAsDaemon 0
SocksPort 0
ControlPort 0
ORPort 0
DirPort 0
Log notice stdout
SafeLogging 1

# Permanent identity: NEVER delete, replace or publish this directory or keys.
HiddenServiceDir /var/lib/tor/miguelzacca-onion/
HiddenServiceVersion 3
HiddenServicePort 80 127.0.0.1:8080
