# Standalone configuration: never include sites-enabled or the default server.
user www-data;
worker_processes auto;
pid /run/miguelzacca-onion-nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /run/miguelzacca-onion-nginx/client-body;
    sendfile on;
    open_file_cache off;
    access_log off;
    server_tokens off;

    server {
        listen 127.0.0.1:8080;
        server_name _;
        root /var/www/miguelzacca-onion/current;
        index index.html;
        # Directory redirects must retain the onion host and virtual port 80.
        absolute_redirect off;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
